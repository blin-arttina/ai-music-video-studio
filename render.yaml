services:
  - type: web
    name: ai-music-video-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BLIND_ART_SERVER_URL
        value: https://blind-art-server.onrender.com
